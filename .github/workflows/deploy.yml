name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "frontend/**"
      - "backend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.15.8

jobs:
  # 承認前に差分を確認できるよう、plan結果をジョブサマリーに出す
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false | tee plan.txt

      - name: Write plan to job summary
        if: always()
        run: |
          {
            echo '### Terraform Plan'
            echo '```'
            cat plan.txt 2>/dev/null || echo 'planの実行に失敗しました。ジョブのログを確認してください。'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform output -raw aws_cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
